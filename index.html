<!doctype html>
<html lang='en'>
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <title>Solutions Medical Providers | Mobile NP Dashboard</title>
    <link rel='stylesheet' href='styles.css' />
  </head>
  <body>
    <div class='dashboard-shell'>
      <header class='topbar' aria-label='Dashboard header'>
        <div class='brand-lockup'>
          <div class='brand-mark' aria-hidden='true'>SMP</div>
          <div>
            <p class='eyebrow' id='company-name'>Solutions Medical Providers</p>
            <h1 id='dashboard-title'>Mobile NP Dashboard</h1>
          </div>
        </div>
        <div class='topbar-status' aria-label='Dashboard status'>
          <span id='period-label'>May 12 to May 18</span>
          <span id='snapshot-label'>Daily Operations</span>
        </div>
      </header>

      <main id='dashboard-root' aria-live='polite'></main>
    </div>

    <script src='data.js'></script>
    <script src='app.js'></script>
  </body>
</html>
